[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myai-server"
version = "0.1.0"
description = "Central account server for MyAI Academy—accounts, pairing, and device coordination."
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "email-validator>=2.0",
    "httpx>=0.27",
    # Starlette needs this to read *any* form body, including the urlencoded POST Apple
    # sends to the OAuth callback (`response_mode=form_post`).
    "python-multipart>=0.0.9",
    # Argon2id for password hashing. The KDF arrived in cryptography 44.
    "cryptography>=44",
]

[tool.hatch.build.targets.wheel]
packages = ["src/myai_server"]
