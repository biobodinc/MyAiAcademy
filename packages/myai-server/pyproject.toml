[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myai-server"
version = "0.1.0"
description = "Central account server for MyAI Academy—accounts, pairing, and device coordination."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/myai_server"]
