[project]
name = "myai-core"
version = "0.1.0"
description = "MyAI Academy local AI service: the private, local-first core that runs on the user's own hardware."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "MyAI Academy" }]
dependencies = [
  "fastapi>=0.120",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psutil>=6.1",
  "platformdirs>=4.3",
  "python-ulid>=3.0",
  "httpx>=0.27",
  "pypdf>=5.0",
  # X.509 for the certificate the host mints when you let a phone reach it (Phase 6).
  "cryptography>=45.0",
]

[project.optional-dependencies]
# Optional probes; the core never hard-depends on them.
cpuinfo = ["py-cpuinfo>=9.0"]
# The local inference runtime. Desktop bundles include it; the service reports
# honestly when it is absent.
local-inference = ["llama-cpp-python>=0.3.9"]

[project.scripts]
myai-core = "myai_core.server:main"

[dependency-groups]
dev = [
  "pytest>=9.0",
  "pytest-cov>=7.0",
  "httpx>=0.27",
  "mypy>=1.19",
  "ruff>=0.16",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myai_core"]
